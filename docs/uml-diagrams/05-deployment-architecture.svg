<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 18px Arial; text-anchor: middle; }
      .section-title { font: bold 14px Arial; text-anchor: middle; fill: #1a73e8; }
      .service-box { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2; rx: 8; }
      .cloud-service { fill: #f3e5f5; stroke: #8e24aa; stroke-width: 2; rx: 8; }
      .database-box { fill: #e8f5e8; stroke: #137333; stroke-width: 2; rx: 8; }
      .client-box { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; rx: 8; }
      .queue-box { fill: #fce8e6; stroke: #d93025; stroke-width: 2; rx: 8; }
      .storage-box { fill: #e0f2f1; stroke: #00695c; stroke-width: 2; rx: 8; }
      .service-text { font: bold 12px Arial; text-anchor: middle; }
      .detail-text { font: 10px Arial; }
      .endpoint-text { font: 9px Arial; fill: #5f6368; }
      .relationship { stroke: #5f6368; stroke-width: 2; marker-end: url(#arrowhead); }
      .data-flow { stroke: #4285f4; stroke-width: 3; marker-end: url(#arrowhead); stroke-dasharray: 8,4; }
      .secure-connection { stroke: #34a853; stroke-width: 2; marker-end: url(#arrowhead); }
      .note { fill: #f8f9fa; stroke: #5f6368; stroke-width: 1; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="30" class="title">Invoice Processing System - Deployment Architecture</text>

  <!-- Client Tier -->
  <text x="200" y="70" class="section-title">Client Tier</text>

  <!-- React Frontend -->
  <rect x="50" y="90" width="300" height="120" class="client-box"/>
  <text x="200" y="115" class="service-text">React Frontend (SPA)</text>
  <text x="70" y="135" class="detail-text">• Multi-upload dashboard with real-time progress</text>
  <text x="70" y="150" class="detail-text">• Organization-aware UI components</text>
  <text x="70" y="165" class="detail-text">• Firebase Auth integration</text>
  <text x="70" y="180" class="detail-text">• Firestore real-time listeners</text>
  <text x="70" y="195" class="endpoint-text">Deployed: Netlify CDN (invoice-app-v2.netlify.app)</text>

  <!-- CDN/Edge -->
  <rect x="400" y="90" width="200" height="120" class="client-box"/>
  <text x="500" y="115" class="service-text">Netlify Edge</text>
  <text x="420" y="135" class="detail-text">• Global CDN distribution</text>
  <text x="420" y="150" class="detail-text">• Auto SSL certificates</text>
  <text x="420" y="165" class="detail-text">• Branch preview deployments</text>
  <text x="420" y="180" class="detail-text">• Build optimization</text>
  <text x="420" y="195" class="endpoint-text">GitHub integration for CI/CD</text>

  <!-- Authentication Tier -->
  <text x="800" y="70" class="section-title">Authentication & Authorization</text>

  <!-- Firebase Auth -->
  <rect x="650" y="90" width="300" height="120" class="database-box"/>
  <text x="800" y="115" class="service-text">Firebase Authentication</text>
  <text x="670" y="135" class="detail-text">• Google OAuth & Email/Password providers</text>
  <text x="670" y="150" class="detail-text">• Custom claims for organization roles</text>
  <text x="670" y="165" class="detail-text">• JWT token validation for backend services</text>
  <text x="670" y="180" class="detail-text">• Multi-tenant user management</text>
  <text x="670" y="195" class="endpoint-text">Identity provider for all services</text>

  <!-- API Gateway Tier -->
  <text x="1200" y="70" class="section-title">API Gateway</text>

  <!-- Cloud Load Balancer -->
  <rect x="1000" y="90" width="250" height="120" class="cloud-service"/>
  <text x="1125" y="115" class="service-text">Google Cloud Load Balancer</text>
  <text x="1020" y="135" class="detail-text">• HTTPS termination</text>
  <text x="1020" y="150" class="detail-text">• Regional traffic distribution</text>
  <text x="1020" y="165" class="detail-text">• Health check monitoring</text>
  <text x="1020" y="180" class="detail-text">• Auto-scaling triggers</text>
  <text x="1020" y="195" class="endpoint-text">Routes to Cloud Run services</text>

  <!-- Application Tier -->
  <text x="400" y="270" class="section-title">Application Services (Google Cloud Run)</text>

  <!-- Initial API Service -->
  <rect x="50" y="290" width="300" height="140" class="service-box"/>
  <text x="200" y="315" class="service-text">Initial API Service</text>
  <text x="70" y="335" class="detail-text">• File upload with signed URLs</text>
  <text x="70" y="350" class="detail-text">• User authentication verification</text>
  <text x="70" y="365" class="detail-text">• Cloud Tasks job creation</text>
  <text x="70" y="380" class="detail-text">• Organization context extraction</text>
  <text x="70" y="395" class="detail-text">• Usage limit validation</text>
  <text x="70" y="410" class="endpoint-text">URL: https://initial-api-[hash]-uc.a.run.app</text>
  <text x="70" y="423" class="endpoint-text">Container: Docker (Python FastAPI)</text>

  <!-- Queue Processor Service -->
  <rect x="400" y="290" width="300" height="140" class="service-box"/>
  <text x="550" y="315" class="service-text">Queue Processor Service</text>
  <text x="420" y="335" class="detail-text">• Cloud Tasks handler for async processing</text>
  <text x="420" y="350" class="detail-text">• OpenAI Vision API integration</text>
  <text x="420" y="365" class="detail-text">• Invoice data extraction & structuring</text>
  <text x="420" y="380" class="detail-text">• Organization-aware result storage</text>
  <text x="420" y="395" class="detail-text">• Error handling & retry logic</text>
  <text x="420" y="410" class="endpoint-text">URL: https://queue-processor-[hash]-uc.a.run.app</text>
  <text x="420" y="423" class="endpoint-text">Container: Docker (Python Flask)</text>

  <!-- Archive Manager Service -->
  <rect x="750" y="290" width="300" height="140" class="service-box"/>
  <text x="900" y="315" class="service-text">Archive Manager Service</text>
  <text x="770" y="335" class="detail-text">• Completed results archiving</text>
  <text x="770" y="350" class="detail-text">• Organization-aware data lifecycle</text>
  <text x="770" y="365" class="detail-text">• CSV export generation</text>
  <text x="770" y="380" class="detail-text">• Cross-collection data migration</text>
  <text x="770" y="395" class="detail-text">• Cleanup & maintenance tasks</text>
  <text x="770" y="410" class="endpoint-text">URL: https://archive-manager-[hash]-uc.a.run.app</text>
  <text x="770" y="423" class="endpoint-text">Container: Docker (Python Flask)</text>

  <!-- Messaging Tier -->
  <text x="200" y="490" class="section-title">Async Messaging</text>

  <!-- Cloud Tasks -->
  <rect x="50" y="510" width="300" height="100" class="queue-box"/>
  <text x="200" y="535" class="service-text">Google Cloud Tasks</text>
  <text x="70" y="555" class="detail-text">• Reliable async job processing queue</text>
  <text x="70" y="570" class="detail-text">• Automatic retry with exponential backoff</text>
  <text x="70" y="585" class="detail-text">• Dead letter queue for failed jobs</text>
  <text x="70" y="600" class="endpoint-text">Queue: projects/[project]/locations/us-central1/queues/invoice-processing</text>

  <!-- External Services -->
  <text x="600" y="490" class="section-title">External AI Services</text>

  <!-- OpenAI -->
  <rect x="400" y="510" width="250" height="100" class="cloud-service"/>
  <text x="525" y="535" class="service-text">OpenAI API</text>
  <text x="420" y="555" class="detail-text">• GPT-4 Vision for invoice analysis</text>
  <text x="420" y="570" class="detail-text">• Structured data extraction</text>
  <text x="420" y="585" class="detail-text">• Rate limiting & error handling</text>
  <text x="420" y="600" class="endpoint-text">Endpoint: api.openai.com/v1/chat/completions</text>

  <!-- Storage Tier -->
  <text x="900" y="490" class="section-title">Storage & Database</text>

  <!-- Cloud Storage -->
  <rect x="750" y="510" width="200" height="100" class="storage-box"/>
  <text x="850" y="535" class="service-text">Cloud Storage</text>
  <text x="770" y="555" class="detail-text">• Invoice file uploads</text>
  <text x="770" y="570" class="detail-text">• User-isolated bucket paths</text>
  <text x="770" y="585" class="detail-text">• Signed URL access</text>
  <text x="770" y="600" class="endpoint-text">Bucket: invoice-processing-bucket</text>

  <!-- Firestore -->
  <rect x="1000" y="510" width="250" height="100" class="database-box"/>
  <text x="1125" y="535" class="service-text">Cloud Firestore</text>
  <text x="1020" y="555" class="detail-text">• Organization-aware collections</text>
  <text x="1020" y="570" class="detail-text">• Real-time data synchronization</text>
  <text x="1020" y="585" class="detail-text">• Multi-tenant data isolation</text>
  <text x="1020" y="600" class="endpoint-text">Native mode with composite indexes</text>

  <!-- Monitoring Tier -->
  <text x="400" y="670" class="section-title">Monitoring & Observability</text>

  <!-- Cloud Logging -->
  <rect x="100" y="690" width="200" height="80" class="cloud-service"/>
  <text x="200" y="715" class="service-text">Cloud Logging</text>
  <text x="120" y="735" class="detail-text">• Service logs aggregation</text>
  <text x="120" y="750" class="detail-text">• Error tracking & alerting</text>
  <text x="120" y="765" class="endpoint-text">Structured JSON logging</text>

  <!-- Cloud Monitoring -->
  <rect x="350" y="690" width="200" height="80" class="cloud-service"/>
  <text x="450" y="715" class="service-text">Cloud Monitoring</text>
  <text x="370" y="735" class="detail-text">• Performance metrics</text>
  <text x="370" y="750" class="detail-text">• Custom dashboards</text>
  <text x="370" y="765" class="endpoint-text">SLI/SLO tracking</text>

  <!-- Error Reporting -->
  <rect x="600" y="690" width="200" height="80" class="cloud-service"/>
  <text x="700" y="715" class="service-text">Error Reporting</text>
  <text x="620" y="735" class="detail-text">• Exception tracking</text>
  <text x="620" y="750" class="detail-text">• Real-time alerts</text>
  <text x="620" y="765" class="endpoint-text">Automated issue detection</text>

  <!-- Security -->
  <text x="1200" y="670" class="section-title">Security & Compliance</text>

  <!-- IAM -->
  <rect x="900" y="690" width="200" height="80" class="cloud-service"/>
  <text x="1000" y="715" class="service-text">Cloud IAM</text>
  <text x="920" y="735" class="detail-text">• Service account permissions</text>
  <text x="920" y="750" class="detail-text">• Least privilege access</text>
  <text x="920" y="765" class="endpoint-text">Role-based security</text>

  <!-- Security Manager -->
  <rect x="1150" y="690" width="200" height="80" class="cloud-service"/>
  <text x="1250" y="715" class="service-text">Security Manager</text>
  <text x="1170" y="735" class="detail-text">• SSL/TLS certificates</text>
  <text x="1170" y="750" class="detail-text">• Secret management</text>
  <text x="1170" y="765" class="endpoint-text">VPC network security</text>

  <!-- Network Connections -->
  
  <!-- Client to CDN -->
  <line x1="350" y1="150" x2="400" y2="150" class="secure-connection"/>
  
  <!-- CDN to Auth -->
  <line x1="600" y1="150" x2="650" y2="150" class="secure-connection"/>
  
  <!-- Auth to Load Balancer -->
  <line x1="950" y1="150" x2="1000" y2="150" class="secure-connection"/>
  
  <!-- Load Balancer to Services -->
  <line x1="1125" y1="210" x2="900" y2="290" class="relationship"/>
  <line x1="1125" y1="210" x2="550" y2="290" class="relationship"/>
  <line x1="1125" y1="210" x2="200" y2="290" class="relationship"/>
  
  <!-- Services to Cloud Tasks -->
  <line x1="200" y1="430" x2="200" y2="510" class="data-flow"/>
  <line x1="350" y1="560" x2="400" y2="360" class="data-flow"/>
  
  <!-- Queue Processor to OpenAI -->
  <line x1="550" y1="430" x2="525" y2="510" class="relationship"/>
  
  <!-- Services to Storage -->
  <line x1="200" y1="430" x2="850" y2="510" class="relationship"/>
  <line x1="550" y1="430" x2="1125" y2="510" class="data-flow"/>
  <line x1="900" y1="430" x2="1125" y2="510" class="data-flow"/>
  
  <!-- Client to Storage (for real-time) -->
  <line x1="200" y1="210" x2="1125" y2="510" class="data-flow" stroke-dasharray="4,8"/>
  
  <!-- Deployment Notes -->
  <rect x="1350" y="200" width="220" height="300" class="note"/>
  <text x="1460" y="220" style="font: bold 12px Arial; text-anchor: middle;">🚀 Deployment Configuration</text>
  
  <text x="1360" y="245" style="font: 10px Arial; font-weight: bold;">Container Registry:</text>
  <text x="1365" y="260" style="font: 9px Arial;">• Google Artifact Registry</text>
  <text x="1365" y="275" style="font: 9px Arial;">• Automated CI/CD pipelines</text>
  
  <text x="1360" y="295" style="font: 10px Arial; font-weight: bold;">Scaling Configuration:</text>
  <text x="1365" y="310" style="font: 9px Arial;">• Min instances: 0 (cost optimization)</text>
  <text x="1365" y="325" style="font: 9px Arial;">• Max instances: 100 per service</text>
  <text x="1365" y="340" style="font: 9px Arial;">• Concurrency: 80 requests/container</text>
  
  <text x="1360" y="360" style="font: 10px Arial; font-weight: bold;">Resource Limits:</text>
  <text x="1365" y="375" style="font: 9px Arial;">• CPU: 1 vCPU per container</text>
  <text x="1365" y="390" style="font: 9px Arial;">• Memory: 2 GiB per container</text>
  <text x="1365" y="405" style="font: 9px Arial;">• Request timeout: 60s</text>
  
  <text x="1360" y="425" style="font: 10px Arial; font-weight: bold;">Environment:</text>
  <text x="1365" y="440" style="font: 9px Arial;">• Region: us-central1</text>
  <text x="1365" y="455" style="font: 9px Arial;">• VPC: Default with firewall rules</text>
  <text x="1365" y="470" style="font: 9px Arial;">• Service accounts per service</text>
  <text x="1365" y="485" style="font: 9px Arial;">• Encrypted environment variables</text>

  <!-- Data Flow Legend -->
  <rect x="1350" y="530" width="220" height="120" class="note"/>
  <text x="1460" y="550" style="font: bold 12px Arial; text-anchor: middle;">🔄 Data Flow Legend</text>
  
  <line x1="1365" y1="570" x2="1395" y2="570" class="secure-connection"/>
  <text x="1405" y="575" style="font: 9px Arial;">Secure HTTPS Connection</text>
  
  <line x1="1365" y1="585" x2="1395" y2="585" class="data-flow"/>
  <text x="1405" y="590" style="font: 9px Arial;">Async Data Processing</text>
  
  <line x1="1365" y1="600" x2="1395" y2="600" class="relationship"/>
  <text x="1405" y="605" style="font: 9px Arial;">Service Communication</text>
  
  <line x1="1365" y1="615" x2="1395" y2="615" class="data-flow" stroke-dasharray="4,8"/>
  <text x="1405" y="620" style="font: 9px Arial;">Real-time WebSocket</text>
  
  <text x="1360" y="640" style="font: 8px Arial; fill: #5f6368;">All connections use TLS 1.2+ encryption</text>

</svg>