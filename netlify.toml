# Netlify configuration for invoice-app-v2
[build]
  base = "invoice-app-v2"
  publish = "invoice-app-v2/dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--prefer-offline --no-audit"

# SPA routing - redirect all other routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200