<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1000" viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 18px Arial; text-anchor: middle; }
      .section-title { font: bold 14px Arial; text-anchor: middle; fill: #1a73e8; }
      .component-box { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2; rx: 8; }
      .interface-box { fill: #f3e5f5; stroke: #8e24aa; stroke-width: 2; rx: 8; }
      .module-box { fill: #e8f5e8; stroke: #137333; stroke-width: 2; rx: 8; }
      .utility-box { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; rx: 8; }
      .component-text { font: bold 12px Arial; text-anchor: middle; }
      .detail-text { font: 10px Arial; }
      .interface-text { font: 10px Arial; fill: #5f6368; }
      .relationship { stroke: #5f6368; stroke-width: 2; marker-end: url(#arrowhead); }
      .dependency { stroke: #fbbc04; stroke-width: 2; marker-end: url(#arrowhead); stroke-dasharray: 6,3; }
      .composition { stroke: #ea4335; stroke-width: 2; marker-end: url(#diamond); }
      .note { fill: #f8f9fa; stroke: #5f6368; stroke-width: 1; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5f6368"/>
    </marker>
    <marker id="diamond" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#ea4335" stroke="#c5221f"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" class="title">Invoice Processing System - Component Diagram</text>

  <!-- Frontend Components -->
  <text x="200" y="70" class="section-title">Frontend Layer (React SPA)</text>

  <!-- UI Components -->
  <rect x="50" y="90" width="200" height="120" class="component-box"/>
  <text x="150" y="115" class="component-text">UI Components</text>
  <text x="70" y="135" class="detail-text">• MultiUploadDashboard</text>
  <text x="70" y="150" class="detail-text">• UploadProgressTracker</text>
  <text x="70" y="165" class="detail-text">• ResultsDataTable</text>
  <text x="70" y="180" class="detail-text">• OrganizationSelector</text>
  <text x="70" y="195" class="detail-text">• CSV Export Tools</text>

  <!-- State Management -->
  <rect x="300" y="90" width="200" height="120" class="component-box"/>
  <text x="400" y="115" class="component-text">State Management</text>
  <text x="320" y="135" class="detail-text">• useAuth() hook</text>
  <text x="320" y="150" class="detail-text">• BatchManager ref</text>
  <text x="320" y="165" class="detail-text">• FirestoreSyncManager</text>
  <text x="320" y="180" class="detail-text">• Real-time state sync</text>
  <text x="320" y="195" class="detail-text">• Local cache management</text>

  <!-- Services Layer -->
  <text x="600" y="70" class="section-title">Frontend Services Layer</text>

  <!-- User Service -->
  <rect x="550" y="90" width="200" height="120" class="module-box"/>
  <text x="650" y="115" class="component-text">UserService</text>
  <text x="570" y="135" class="detail-text">• User profile management</text>
  <text x="570" y="150" class="detail-text">• Organization context</text>
  <text x="570" y="165" class="detail-text">• Permission validation</text>
  <text x="570" y="180" class="detail-text">• Data path routing</text>
  <text x="570" y="195" class="interface-text">Singleton instance</text>

  <!-- Firestore Service -->
  <rect x="800" y="90" width="200" height="120" class="module-box"/>
  <text x="900" y="115" class="component-text">RealtimeFirestoreService</text>
  <text x="820" y="135" class="detail-text">• Smart collection listeners</text>
  <text x="820" y="150" class="detail-text">• Organization-aware queries</text>
  <text x="820" y="165" class="detail-text">• Real-time data sync</text>
  <text x="820" y="180" class="detail-text">• Cache management</text>
  <text x="820" y="195" class="interface-text">Manages Firestore connections</text>

  <!-- Firebase Integration -->
  <text x="200" y="270" class="section-title">Firebase Integration Layer</text>

  <!-- Auth Module -->
  <rect x="50" y="290" width="200" height="100" class="interface-box"/>
  <text x="150" y="315" class="component-text">Firebase Auth</text>
  <text x="70" y="335" class="detail-text">• Google OAuth provider</text>
  <text x="70" y="350" class="detail-text">• Custom claims handling</text>
  <text x="70" y="365" class="detail-text">• Token refresh management</text>
  <text x="70" y="380" class="interface-text">Third-party authentication</text>

  <!-- Firestore Client -->
  <rect x="300" y="290" width="200" height="100" class="interface-box"/>
  <text x="400" y="315" class="component-text">Firestore Client</text>
  <text x="320" y="335" class="detail-text">• Collection listeners</text>
  <text x="320" y="350" class="detail-text">• Composite queries</text>
  <text x="320" y="365" class="detail-text">• Real-time subscriptions</text>
  <text x="320" y="380" class="interface-text">Firebase SDK wrapper</text>

  <!-- Backend Services -->
  <text x="700" y="270" class="section-title">Backend Service Components</text>

  <!-- Initial API -->
  <rect x="550" y="290" width="200" height="100" class="component-box"/>
  <text x="650" y="315" class="component-text">Initial API Service</text>
  <text x="570" y="335" class="detail-text">• File upload endpoints</text>
  <text x="570" y="350" class="detail-text">• Auth token verification</text>
  <text x="570" y="365" class="detail-text">• Cloud Tasks job creation</text>
  <text x="570" y="380" class="interface-text">FastAPI + Docker container</text>

  <!-- Queue Processor -->
  <rect x="800" y="290" width="200" height="100" class="component-box"/>
  <text x="900" y="315" class="component-text">Queue Processor</text>
  <text x="820" y="335" class="detail-text">• Invoice processing logic</text>
  <text x="820" y="350" class="detail-text">• OpenAI API integration</text>
  <text x="820" y="365" class="detail-text">• Result storage handling</text>
  <text x="820" y="380" class="interface-text">Flask + Cloud Tasks handler</text>

  <!-- Business Logic Layer -->
  <text x="200" y="450" class="section-title">Business Logic Components</text>

  <!-- Processing Core -->
  <rect x="50" y="470" width="200" height="120" class="module-box"/>
  <text x="150" y="495" class="component-text">InvoiceProcessingCore</text>
  <text x="70" y="515" class="detail-text">• Data extraction algorithms</text>
  <text x="70" y="530" class="detail-text">• Validation rules engine</text>
  <text x="70" y="545" class="detail-text">• Format standardization</text>
  <text x="70" y="560" class="detail-text">• Error handling logic</text>
  <text x="70" y="575" class="interface-text">Core business rules</text>

  <!-- Result Manager -->
  <rect x="300" y="470" width="200" height="120" class="module-box"/>
  <text x="400" y="495" class="component-text">ResultManager</text>
  <text x="320" y="515" class="detail-text">• Organization-aware storage</text>
  <text x="320" y="530" class="detail-text">• Collection path routing</text>
  <text x="320" y="545" class="detail-text">• Data sanitization</text>
  <text x="320" y="560" class="detail-text">• Permission enforcement</text>
  <text x="320" y="575" class="interface-text">Data persistence layer</text>

  <!-- Archive Manager -->
  <rect x="550" y="470" width="200" height="120" class="module-box"/>
  <text x="650" y="495" class="component-text">ArchiveManager</text>
  <text x="570" y="515" class="detail-text">• Lifecycle management</text>
  <text x="570" y="530" class="detail-text">• Cross-collection migration</text>
  <text x="570" y="545" class="detail-text">• CSV export generation</text>
  <text x="570" y="560" class="detail-text">• Cleanup operations</text>
  <text x="570" y="575" class="interface-text">Data archival service</text>

  <!-- Utility Layer -->
  <text x="950" y="450" class="section-title">Utility Components</text>

  <!-- Cloud Tasks Manager -->
  <rect x="800" y="470" width="200" height="100" class="utility-box"/>
  <text x="900" y="495" class="component-text">CloudTasksManager</text>
  <text x="820" y="515" class="detail-text">• Async job queuing</text>
  <text x="820" y="530" class="detail-text">• Retry logic handling</text>
  <text x="820" y="545" class="detail-text">• Task monitoring</text>
  <text x="820" y="565" class="interface-text">Google Cloud SDK wrapper</text>

  <!-- OpenAI Processor -->
  <rect x="50" y="640" width="200" height="100" class="utility-box"/>
  <text x="150" y="665" class="component-text">OpenAIProcessor</text>
  <text x="70" y="685" class="detail-text">• Vision API integration</text>
  <text x="70" y="700" class="detail-text">• Prompt engineering</text>
  <text x="70" y="715" class="detail-text">• Rate limit handling</text>
  <text x="70" y="735" class="interface-text">External AI service wrapper</text>

  <!-- Collection Router -->
  <rect x="300" y="640" width="200" height="100" class="utility-box"/>
  <text x="400" y="665" class="component-text">CollectionRouter</text>
  <text x="320" y="685" class="detail-text">• Path determination logic</text>
  <text x="320" y="700" class="detail-text">• Permission-based routing</text>
  <text x="320" y="715" class="detail-text">• Fallback mechanisms</text>
  <text x="320" y="735" class="interface-text">Multi-tenant data routing</text>

  <!-- Processing Tracker -->
  <rect x="550" y="640" width="200" height="100" class="utility-box"/>
  <text x="650" y="665" class="component-text">ProcessingTracker</text>
  <text x="570" y="685" class="detail-text">• Job status monitoring</text>
  <text x="570" y="700" class="detail-text">• Progress reporting</text>
  <text x="570" y="715" class="detail-text">• Failure detection</text>
  <text x="570" y="735" class="interface-text">Status management utility</text>

  <!-- External Interfaces -->
  <text x="950" y="620" class="section-title">External Interfaces</text>

  <!-- Google Cloud Services -->
  <rect x="800" y="640" width="200" height="120" class="interface-box"/>
  <text x="900" y="665" class="component-text">Google Cloud Platform</text>
  <text x="820" y="685" class="detail-text">• Cloud Storage (file uploads)</text>
  <text x="820" y="700" class="detail-text">• Cloud Run (container hosting)</text>
  <text x="820" y="715" class="detail-text">• Cloud Tasks (job queue)</text>
  <text x="820" y="730" class="detail-text">• Firestore (database)</text>
  <text x="820" y="745" class="interface-text">Platform services integration</text>

  <!-- Component Relationships -->
  
  <!-- Frontend Dependencies -->
  <line x1="250" y1="150" x2="300" y2="150" class="dependency"/>
  <line x1="500" y1="150" x2="550" y2="150" class="dependency"/>
  <line x1="150" y1="210" x2="150" y2="290" class="relationship"/>
  <line x1="400" y1="210" x2="400" y2="290" class="relationship"/>
  
  <!-- Service Layer -->
  <line x1="750" y1="150" x2="800" y2="150" class="dependency"/>
  <line x1="650" y1="210" x2="650" y2="290" class="composition"/>
  <line x1="900" y1="210" x2="900" y2="290" class="composition"/>
  
  <!-- Business Logic -->
  <line x1="150" y1="590" x2="150" y2="640" class="dependency"/>
  <line x1="400" y1="590" x2="400" y2="640" class="dependency"/>
  <line x1="650" y1="590" x2="650" y2="640" class="dependency"/>
  
  <!-- Backend to Business Logic -->
  <line x1="650" y1="390" x2="150" y2="470" class="relationship"/>
  <line x1="900" y1="390" x2="400" y2="470" class="relationship"/>
  <line x1="650" y1="390" x2="900" y2="470" class="dependency"/>
  
  <!-- External Dependencies -->
  <line x1="900" y1="570" x2="900" y2="640" class="relationship"/>
  <line x1="150" y1="740" x2="900" y2="640" class="dependency" stroke-dasharray="12,6"/>

  <!-- Architecture Notes -->
  <rect x="50" y="800" width="300" height="120" class="note"/>
  <text x="200" y="820" style="font: bold 12px Arial; text-anchor: middle;">🏗️ Architecture Principles</text>
  <text x="70" y="840" style="font: 10px Arial;">• Separation of concerns with distinct layers</text>
  <text x="70" y="855" style="font: 10px Arial;">• Dependency injection for testability</text>
  <text x="70" y="870" style="font: 10px Arial;">• Service-oriented architecture (SOA)</text>
  <text x="70" y="885" style="font: 10px Arial;">• Organization-aware multi-tenant design</text>
  <text x="70" y="900" style="font: 10px Arial;">• Real-time data synchronization patterns</text>

  <!-- Component Interaction Notes -->
  <rect x="400" y="800" width="350" height="120" class="note"/>
  <text x="575" y="820" style="font: bold 12px Arial; text-anchor: middle;">🔄 Component Interaction Patterns</text>
  <text x="420" y="840" style="font: 10px Arial;">• Frontend components communicate via React Context</text>
  <text x="420" y="855" style="font: 10px Arial;">• Services use singleton pattern for state management</text>
  <text x="420" y="870" style="font: 10px Arial;">• Backend services are stateless and containerized</text>
  <text x="420" y="885" style="font: 10px Arial;">• Async processing through Cloud Tasks queuing</text>
  <text x="420" y="900" style="font: 10px Arial;">• Real-time updates via Firestore listeners</text>

  <!-- Technology Stack -->
  <rect x="800" y="800" width="300" height="120" class="note"/>
  <text x="950" y="820" style="font: bold 12px Arial; text-anchor: middle;">⚙️ Technology Stack</text>
  <text x="820" y="840" style="font: 10px Arial;">Frontend: React 18, TypeScript, Tailwind CSS</text>
  <text x="820" y="855" style="font: 10px Arial;">Backend: Python (FastAPI, Flask), Docker</text>
  <text x="820" y="870" style="font: 10px Arial;">Database: Google Cloud Firestore</text>
  <text x="820" y="885" style="font: 10px Arial;">Hosting: Netlify (frontend), Cloud Run (backend)</text>
  <text x="820" y="900" style="font: 10px Arial;">AI: OpenAI GPT-4 Vision API</text>

</svg>