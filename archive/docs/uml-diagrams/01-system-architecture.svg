<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 18px Arial; text-anchor: middle; }
      .service { fill: #4285f4; stroke: #1a73e8; stroke-width: 2; rx: 8; }
      .database { fill: #34a853; stroke: #137333; stroke-width: 2; rx: 8; }
      .frontend { fill: #ea4335; stroke: #c5221f; stroke-width: 2; rx: 8; }
      .external { fill: #fbbc04; stroke: #f9ab00; stroke-width: 2; rx: 8; }
      .text { font: 12px Arial; text-anchor: middle; }
      .arrow { stroke: #5f6368; stroke-width: 2; marker-end: url(#arrowhead); }
      .flow-text { font: 10px Arial; fill: #5f6368; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" class="title">Invoice Processing System - Organization-Aware Architecture</text>

  <!-- Frontend Layer -->
  <rect x="50" y="80" width="200" height="100" class="frontend"/>
  <text x="150" y="120" class="text">React Frontend</text>
  <text x="150" y="140" class="text">Multi-Upload Dashboard</text>
  <text x="150" y="155" class="text">Organization Context</text>

  <!-- API Gateway Layer -->
  <rect x="350" y="80" width="180" height="100" class="service"/>
  <text x="440" y="120" class="text">Initial API</text>
  <text x="440" y="140" class="text">File Upload & Auth</text>
  <text x="440" y="155" class="text">User Context Extraction</text>

  <!-- Processing Layer -->
  <rect x="600" y="80" width="180" height="100" class="service"/>
  <text x="690" y="120" class="text">Queue Processor</text>
  <text x="690" y="140" class="text">OpenAI Vision API</text>
  <text x="690" y="155" class="text">Organization Routing</text>

  <!-- Archive Service -->
  <rect x="850" y="80" width="180" height="100" class="service"/>
  <text x="940" y="120" class="text">Archive Manager</text>
  <text x="940" y="140" class="text">Data Lifecycle</text>
  <text x="940" y="155" class="text">Collection Routing</text>

  <!-- Cloud Infrastructure -->
  <rect x="350" y="230" width="180" height="80" class="external"/>
  <text x="440" y="265" class="text">Google Cloud Storage</text>
  <text x="440" y="280" class="text">File Storage</text>

  <rect x="600" y="230" width="180" height="80" class="external"/>
  <text x="690" y="265" class="text">Cloud Tasks</text>
  <text x="690" y="280" class="text">Queue Management</text>

  <rect x="850" y="230" width="180" height="80" class="external"/>
  <text x="940" y="265" class="text">OpenAI Vision API</text>
  <text x="940" y="280" class="text">Invoice Processing</text>

  <!-- Database Layer -->
  <rect x="200" y="400" width="800" height="300" class="database"/>
  <text x="600" y="430" class="title" style="fill: white;">Firestore - Organization-Aware Collections</text>

  <!-- Organization Collections -->
  <rect x="220" y="460" width="220" height="80" style="fill: #137333; stroke: white; stroke-width: 1; rx: 4;"/>
  <text x="330" y="485" class="text" style="fill: white;">organizations/{orgId}</text>
  <text x="330" y="505" class="text" style="fill: white;">├── invoice_results</text>
  <text x="330" y="520" class="text" style="fill: white;">└── invoice_results_archive</text>

  <!-- User Collections -->
  <rect x="460" y="460" width="220" height="80" style="fill: #137333; stroke: white; stroke-width: 1; rx: 4;"/>
  <text x="570" y="485" class="text" style="fill: white;">users/{userUID}</text>
  <text x="570" y="505" class="text" style="fill: white;">├── invoice_results</text>
  <text x="570" y="520" class="text" style="fill: white;">└── invoice_results_archive</text>

  <!-- Legacy Collections -->
  <rect x="700" y="460" width="220" height="80" style="fill: #137333; stroke: white; stroke-width: 1; rx: 4;"/>
  <text x="810" y="485" class="text" style="fill: white;">Legacy (Root)</text>
  <text x="810" y="505" class="text" style="fill: white;">├── invoice_results</text>
  <text x="810" y="520" class="text" style="fill: white;">└── invoice_results_archive</text>

  <!-- Auth & User Management -->
  <rect x="220" y="570" width="220" height="100" style="fill: #137333; stroke: white; stroke-width: 1; rx: 4;"/>
  <text x="330" y="595" class="text" style="fill: white;">Authentication</text>
  <text x="330" y="615" class="text" style="fill: white;">├── users</text>
  <text x="330" y="630" class="text" style="fill: white;">├── organizations</text>
  <text x="330" y="645" class="text" style="fill: white;">└── user_invites</text>

  <!-- Task Tracking -->
  <rect x="460" y="570" width="220" height="100" style="fill: #137333; stroke: white; stroke-width: 1; rx: 4;"/>
  <text x="570" y="595" class="text" style="fill: white;">Task Management</text>
  <text x="570" y="615" class="text" style="fill: white;">├── cloud_tasks</text>
  <text x="570" y="630" class="text" style="fill: white;">├── processing_status</text>
  <text x="570" y="645" class="text" style="fill: white;">└── job_tracking</text>

  <!-- Indexes -->
  <rect x="700" y="570" width="220" height="100" style="fill: #137333; stroke: white; stroke-width: 1; rx: 4;"/>
  <text x="810" y="595" class="text" style="fill: white;">Composite Indexes</text>
  <text x="810" y="615" class="text" style="fill: white;">├── organizationId + userUID</text>
  <text x="810" y="630" class="text" style="fill: white;">├── userUID + status</text>
  <text x="810" y="645" class="text" style="fill: white;">└── user_email + created_at</text>

  <!-- Flow Arrows -->
  <line x1="250" y1="130" x2="350" y2="130" class="arrow"/>
  <text x="300" y="125" class="flow-text">Upload Request</text>

  <line x1="530" y1="130" x2="600" y2="130" class="arrow"/>
  <text x="565" y="125" class="flow-text">Cloud Task</text>

  <line x1="780" y1="130" x2="850" y2="130" class="arrow"/>
  <text x="815" y="125" class="flow-text">Archive</text>

  <line x1="440" y1="180" x2="440" y2="230" class="arrow"/>
  <line x1="690" y1="180" x2="690" y2="230" class="arrow"/>
  <line x1="940" y1="180" x2="940" y2="230" class="arrow"/>

  <line x1="440" y1="310" x2="440" y2="400" class="arrow"/>
  <line x1="690" y1="310" x2="690" y2="400" class="arrow"/>
  <line x1="940" y1="310" x2="940" y2="400" class="arrow"/>

  <!-- Multi-tenant Key -->
  <rect x="50" y="720" width="300" height="70" style="fill: #f8f9fa; stroke: #dadce0; stroke-width: 1; rx: 4;"/>
  <text x="200" y="740" class="text" style="font-weight: bold;">Multi-Tenant Architecture</text>
  <text x="60" y="760" class="flow-text">🏢 Organization-scoped data isolation</text>
  <text x="60" y="775" class="flow-text">👤 User-scoped fallback collections</text>

</svg>